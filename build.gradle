plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.7-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '0.1.110' apply false
}

subprojects {
    apply plugin: 'java'

    repositories {
        maven {
            name = 'ClothConfig'
            url = uri('https://maven.shedaniel.me/')
        }
        maven {
            name = 'EoinKanroGithub'
            url = uri("https://eoinkanro.github.io/maven/")
        }
    }

    dependencies {
        compileOnly "io.github.eoinkanro.mc:kanrommon:${kanrommon_version}"

        compileOnly "org.projectlombok:lombok:${lombok_version}"
        annotationProcessor "org.projectlombok:lombok:${lombok_version}"

        //it's safe for every loader.
        //'cloth-config' can't be used bcz of setSavingRunnable(class_471....)
        compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_api_version}"
    }
}
